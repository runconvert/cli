# Release: git tag v0.1.0 && git push origin v0.1.0
name: release
on:
  push:
    tags: ["v*"]
  # Started by release-please (release-please.yml) on the new tag.
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  id-token: write # npm trusted publishing
jobs:
  release:
    runs-on: ubuntu-latest
    # Waits for approval from a required reviewer of the "release" environment.
    environment: release
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@v6
        with: { distribution: goreleaser, version: "~> v2", args: release --clean }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # npm: @runconvert/cli plus one package per platform, with npm trusted publishing (OIDC, no token).
      # Each of the 7 packages has this repo + release.yml + the "release" environment as its trusted publisher.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1+
      - name: Publish to npm
        run: node npm/publish.mjs ${{ steps.v.outputs.version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The remote MCP server (mcp.runconvert.com), deployed by runconvert/backend.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/runconvert/runconvert-cli/mcp:${{ steps.v.outputs.version }}
            ghcr.io/runconvert/runconvert-cli/mcp:latest
