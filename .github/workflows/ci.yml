# Every push and pull request: vet, test, and build all six binaries
# (attached to the run for 7 days).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with: { distribution: goreleaser, version: "~> v2", args: build --snapshot --clean }
      - uses: actions/upload-artifact@v4
        with:
          name: runconvert-${{ github.sha }}
          path: dist/runconvert_*/runconvert*
          retention-days: 7

      - name: Build the MCP server image (not pushed)
        run: docker build --build-arg VERSION=ci -t runconvert-mcp:ci .
      - name: Smoke-test the image
        run: |
          docker run -d --name mcp -p 8080:8080 runconvert-mcp:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/mcp)" = 401
          curl -fsS localhost:8080/.well-known/oauth-protected-resource | grep -q '"authorization_servers"'
          docker rm -f mcp
